name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (Kotlin ${{ matrix.kotlin-version }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: ["1.9.22", "2.0.21"]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Copy CI gradle.properties
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
        build-scan-terms-of-use-agree: "yes"

    - name: Setup Android SDK
      if: matrix.kotlin-version == '2.0.21'
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Run tests
      run: >
        ./gradlew test --no-daemon
        -PkotlinVersion=${{ matrix.kotlin-version }}
      timeout-minutes: 30
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-kotlin-${{ matrix.kotlin-version }}
        path: '**/build/test-results/test/TEST-*.xml'
        retention-days: 7
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-kotlin-${{ matrix.kotlin-version }}
        path: '**/build/libs/*.jar'
        retention-days: 7
