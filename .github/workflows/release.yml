name: Release

on:
  push:
    tags: [ 'v*' ]


concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Derive version from tag
      id: version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"

        if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
          echo "Release tags must start with 'v', for example v2.0.0" >&2
          exit 1
        fi

        if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
          echo "Invalid release version '$VERSION' from tag '$GITHUB_REF_NAME'" >&2
          exit 1
        fi

        echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
        echo "ORG_GRADLE_PROJECT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Copy CI gradle.properties
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
        build-scan-terms-of-use-agree: "yes"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Build and publish Kotlin 1.9 JVM artifacts to Maven Central
      run: >
        ./gradlew
        build
        publishToSonatype
        closeAndReleaseSonatypeStagingRepository
        --no-daemon
        -PkotlinVersion=1.9.22
        -PkotlinArtifactSuffix=-kotlin19
      env:
        CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
        CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Upload Kotlin 1.9 test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kotlin19-test-results
        path: '**/build/test-results/test/TEST-*.xml'
        if-no-files-found: warn
        retention-days: 7

    - name: Build and publish Kotlin 2 artifacts to Maven Central
      run: >
        ./gradlew
        build
        publishToSonatype
        closeAndReleaseSonatypeStagingRepository
        --no-daemon
        -PkotlinVersion=2.0.21
      env:
        CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
        CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Publish Kotlin 1.9 JVM artifacts to GitHub Packages
      run: >
        ./gradlew
        publishMavenPublicationToGitHubPackagesRepository
        --no-daemon
        -PkotlinVersion=1.9.22
        -PkotlinArtifactSuffix=-kotlin19
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Publish Kotlin 2 artifacts to GitHub Packages
      run: >
        ./gradlew
        publishMavenPublicationToGitHubPackagesRepository
        --no-daemon
        -PkotlinVersion=2.0.21
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Ripple Kotlin ${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: '**/build/libs/*.jar'
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
